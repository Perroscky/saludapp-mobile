name: saludapp_mobile
description: Aplicación móvil para gestión de citas médicas
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP y utilidades
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # UI
  fluttertoast: ^8.2.4
  intl: ^0.18.1
  
  # Seguridad
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true